openapi: 3.1.0
info:
  title: TOTVS Protheus — API REST (reconstruída pelo catálogo)
  version: 12.1.x
  description: 'Reconstrução das leituras de negócio do Protheus a partir do TDN e do TOTVS Developers. Não existe
    host público: cada cliente expõe o REST do próprio servidor. Operações com o mesmo caminho real (genericQuery)
    aparecem com um sufixo ''#<ALIAS>'' no caminho e o caminho real em x-url-real.'
  x-fonte-url: https://tdn.totvs.com/display/public/framework/GenericQuery
  x-data-consulta: '2026-10-19'
servers:
- url: https://{servidor}:{porta}/rest
  description: Produção — servidor REST do Protheus do cliente
  variables:
    servidor:
      default: protheus.cliente.example.com
    porta:
      default: '8080'
- url: https://{servidor}:{porta}/rest
  description: Homologação — ambiente de testes do próprio cliente, quando existir (não há sandbox da TOTVS)
  variables:
    servidor:
      default: protheus-homologacao.cliente.example.com
    porta:
      default: '8080'
security:
- basicAuth: []
- bearerAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Usuário e senha do Protheus em Base64 (usuario:senha). Fonte: https://tdn.totvs.com/pages/viewpage.action?pageId=185748452'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token de POST /api/oauth2/v1/token (1 h). Fonte: https://tdn.totvs.com/pages/viewpage.action?pageId=465383509'
paths:
  /api/oauth2/v1/token:
    post:
      operationId: totvs-protheus__autenticacao__autenticar
      summary: API de token de acesso às APIs REST do Protheus (/api/oauth2/v1/token, grant_type=password)
      description: 'Troca usuário e senha do Protheus por um access_token JWT (Bearer, 1 hora) e um refresh_token
        (24 horas). Disponível a partir da LIB 20190705; versão mínima 12.1.23 na especificação TOTVS Developers.


        Quando usar: Quando o cliente preferir Bearer a Basic (recomendação da TOTVS: a senha só trafega no login).
        Quando não usar: não é uma consulta para planilha; com Basic Auth habilitado não é obrigatório.'
      tags:
      - Autenticacao
      parameters:
      - name: grant_type
        in: query
        required: true
        description: 'Tipo de concessão: password para login com usuário e senha.'
        schema:
          type: string
          enum:
          - password
          - refresh_token
          default: password
      - name: username
        in: header
        required: true
        description: Usuário do Protheus.
        schema:
          type: string
      - name: password
        in: header
        required: true
        description: Senha do usuário do Protheus.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  scope:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  hasMFA:
                    type: boolean
              example:
                access_token: <<JWT_DE_ACESSO>>
                refresh_token: <<REFRESH_TOKEN>>
                scope: default
                token_type: Bearer
                expires_in: 3600
                hasMFA: false
        '401':
          description: 'Não autorizado — Nas chamadas seguintes: access_token vencido (1 hora) — a API responde
            401 como se não houvesse token.'
        '409':
          description: 'Conflito (ErrorModel TOTVS: code, message, detailedMessage) — Resposta de erro prevista
            na especificação oficial da API Token.'
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/viewpage.action?pageId=465383509
      x-data-consulta: '2026-10-19'
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      security: []
  /api/oauth2/v1/token#refresh_token:
    post:
      operationId: totvs-protheus__autenticacao__autenticar__refresh_token
      summary: Renovação do token (/api/oauth2/v1/token, grant_type=refresh_token)
      description: 'Troca um refresh_token válido por um novo par access_token/refresh_token, renovando os dois
        prazos (1 hora e 24 horas) sem reenviar a senha.


        Quando usar: Antes de o access_token vencer (ou ao receber 401 por expiração), enquanto o refresh_token
        tiver menos de 24 horas. Quando não usar: com refresh vencido, refaça o login com usuário e senha.'
      tags:
      - Autenticacao
      parameters:
      - name: grant_type
        in: query
        required: true
        description: 'Fixo: refresh_token.'
        schema:
          type: string
          enum:
          - refresh_token
          - password
          default: refresh_token
      - name: refresh_token
        in: query
        required: true
        description: Refresh token recebido no login anterior.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  scope:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  hasMFA:
                    type: boolean
              example:
                access_token: <<JWT_DE_ACESSO>>
                refresh_token: <<REFRESH_TOKEN>>
                scope: default
                token_type: Bearer
                expires_in: 3600
                hasMFA: false
        '401':
          description: 'Não autorizado — Nas chamadas seguintes: access_token vencido (1 hora) — a API responde
            401 como se não houvesse token.'
        '409':
          description: 'Conflito (ErrorModel TOTVS: code, message, detailedMessage) — Resposta de erro prevista
            na especificação oficial da API Token.'
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/viewpage.action?pageId=465383509
      x-data-consulta: '2026-10-19'
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      security: []
      x-url-real: /api/oauth2/v1/token
  /api/framework/v1/basicProtheusServices/xfilial:
    get:
      operationId: totvs-protheus__empresa__obter__filial_atual
      summary: BasicProtheusServices — xfilial (filial de cada tabela)
      description: 'Devolve, para cada alias informado, o código de filial que o Protheus usa naquela tabela com
        o tenantId da requisição (tabelas compartilhadas voltam com a filial em branco ou parcial).


        Quando usar: Como teste de conexão barato (valida endereço, usuário, senha e tenantId numa chamada só) e
        para entender se as tabelas são compartilhadas entre filiais antes de extrair dados. Quando não usar: não
        traz dados de negócio.'
      tags:
      - Empresa
      parameters:
      - name: alias
        in: query
        required: true
        description: 'Aliases separados por vírgula (ex.: SA1,SE1,SE5).'
        schema:
          type: string
          default: SA1,SA2,SB1,SE1,SE2,SE5
      - name: tenantId
        in: header
        required: false
        description: 'Grupo de empresas e filial em que a consulta roda, no formato <grupo>,<filial> (ex.: T1,D
          MG 01). Pode ir só o grupo.'
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  SA1:
                    type: string
                  SA2:
                    type: string
                  SB1:
                    type: string
                  SE1:
                    type: string
                  SE2:
                    type: string
                  SE5:
                    type: string
              example:
                SA1: 'D MG '
                SA2: 'D MG '
                SB1: '    '
                SE1: 'D MG 01 '
                SE2: 'D MG 01 '
                SE5: 'D MG 01 '
        '401':
          description: Não autorizado — Usuário ou senha inválidos, token vencido, ou tenantId com uma filial à
            qual o usuário não tem acesso.
        '404':
          description: Not Found (no REST 2.0 a página vem em HTML) — Endereço errado (falta /rest, barra duplicada)
            ou serviço inexistente na LIB do cliente.
        '503':
          description: Serviço indisponível — REST com consumo de licença por demanda (Stateless=1) e nenhuma licença
            livre no License Server.
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/display/public/framework/BasicProtheusServices
      x-data-consulta: '2026-10-19'
      x-entidade-canonica: Empresa
      x-acao-canonica: obter
  /api/framework/v1/basicProtheusServices/fwformstructview:
    get:
      operationId: totvs-protheus__tabela_auxiliar__obter__campos_tabela
      summary: BasicProtheusServices — fwformstructview (campos e títulos de uma tabela)
      description: 'Devolve a estrutura de tela de um alias: para cada campo, nome físico, título, descrição, tipo,
        tamanho, decimais, opções de combo, se é virtual, se é dado protegido e se é campo de usuário (customização
        do cliente), além das pastas da tela.


        Quando usar: Para descobrir quais campos existem na instalação do cliente (inclusive os customizados, com
        userField = true) e o título que o usuário vê na tela, antes de montar fields e where da genericQuery. Quando
        não usar: não traz registros.'
      tags:
      - TabelaAuxiliar
      parameters:
      - name: alias
        in: query
        required: true
        description: Alias da tabela (pode receber mais de um, separados por vírgula).
        schema:
          type: string
          default: SE1
      - name: tenantId
        in: header
        required: false
        description: 'Grupo de empresas e filial em que a consulta roda, no formato <grupo>,<filial> (ex.: T1,D
          MG 01). Pode ir só o grupo.'
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  SE1:
                    type: object
                    properties:
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            group:
                              type: string
                            order:
                              type: string
                            folder:
                              type: string
                            field:
                              type: string
                            title:
                              type: string
                            type:
                              type: string
                            combobox:
                              type: array
                              items: {}
                            size:
                              type: integer
                            virtual:
                              type: boolean
                            protectedData:
                              type: boolean
                            userField:
                              type: boolean
                            picture:
                              type: string
                            canChange:
                              type: boolean
                            decimal:
                              type: integer
                            description:
                              type: string
                      groups:
                        type: array
                        items: {}
                      folders:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                            id:
                              type: string
              example:
                SE1:
                  fields:
                  - group: ''
                    order: '02'
                    folder: '1'
                    field: E1_NUM
                    title: No. Titulo
                    type: C
                    combobox: []
                    size: 9
                    virtual: false
                    protectedData: false
                    userField: false
                    picture: '@!'
                    canChange: true
                    decimal: 0
                    description: Numero do titulo
                  groups: []
                  folders:
                  - title: Cadastrais
                    id: '1'
        '401':
          description: Não autorizado — Usuário ou senha inválidos, token vencido, ou tenantId com uma filial à
            qual o usuário não tem acesso.
        '404':
          description: Not Found (no REST 2.0 a página vem em HTML) — Endereço errado (falta /rest, barra duplicada)
            ou serviço inexistente na LIB do cliente.
        '503':
          description: Serviço indisponível — REST com consumo de licença por demanda (Stateless=1) e nenhuma licença
            livre no License Server.
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/display/public/framework/BasicProtheusServices
      x-data-consulta: '2026-10-19'
      x-entidade-canonica: TabelaAuxiliar
      x-acao-canonica: obter
  /api/framework/v1/genericQuery#SE1:
    get:
      operationId: totvs-protheus__conta_receber__listar
      summary: Títulos a receber — tabela SE1 (Contas a Receber) pela API genericQuery
      description: 'Lista os títulos do contas a receber (SE1) com prefixo, número, parcela, tipo, cliente e loja,
        natureza, emissão, vencimento original e real, valor, saldo, data da baixa, portador e histórico.


        Quando usar: Para aging de recebíveis, inadimplência, previsão de entradas e posição de carteira por vencimento
        real (E1_VENCREA). Combine com ''Só títulos em aberto'' para a carteira e com o período de baixa para o
        que foi liquidado. Quando não usar: Não use para saber quanto entrou no banco e em que dia: os recebimentos
        efetivos, com juros, descontos e data de crédito, estão nas baixas da SE5 (totvs-protheus.pagamento.listar.baixas).'
      tags:
      - ContaReceber
      parameters:
      - name: tables
        in: query
        required: true
        description: 'Alias da tabela a consultar. Nesta receita é fixo: SE1 (Contas a Receber).'
        schema:
          type: string
          default: SE1
      - name: fields
        in: query
        required: false
        description: Campos a devolver, separados por vírgula, com o nome físico do campo (minúsculo, como nos exemplos
          oficiais). Sem fields a API devolve todos os campos que o usuário pode ver.
        schema:
          type: string
          default: e1_filial,e1_prefixo,e1_num,e1_parcela,e1_tipo,e1_cliente,e1_loja,e1_naturez,e1_emissao,e1_vencto,e1_vencrea,e1_valor,e1_saldo,e1_baixa,e1_portado,e1_situaca,e1_vend1,e1_hist
      - name: where
        in: query
        required: false
        description: Filtro SQL acrescentado à consulta. Datas são texto AAAAMMDD entre aspas simples; valores de
          texto também entre aspas simples. Combine condições com AND.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página, começando em 1.
        schema:
          type: integer
          default: 1
      - name: pagesize
        in: query
        required: false
        description: Registros por página. Teto não publicado; use 100.
        schema:
          type: integer
          default: 100
      - name: filialFilter
        in: query
        required: false
        description: Filtra pela filial ([ALIAS]_FILIAL) correspondente ao tenantId. Padrão true.
        schema:
          type: boolean
          default: true
      - name: deletedFilter
        in: query
        required: false
        description: Filtra registros excluídos logicamente (D_E_L_E_T_). Padrão true; não desligue em relatórios.
        schema:
          type: boolean
          default: true
      - name: order
        in: query
        required: false
        description: 'Ordenação: lista de campos separada por vírgula; ''-'' antes do campo inverte. Nome do parâmetro
          conforme o guia de APIs TOTVS e a classe FWAdapterBaseV2, base da genericQuery.'
        schema:
          type: string
      - name: tenantId
        in: header
        required: false
        description: 'Grupo de empresas e filial em que a consulta roda, no formato <grupo>,<filial> (ex.: T1,D
          MG 01). Pode ir só o grupo.'
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        e1_filial:
                          type: string
                        e1_prefixo:
                          type: string
                        e1_num:
                          type: string
                        e1_parcela:
                          type: string
                        e1_tipo:
                          type: string
                        e1_cliente:
                          type: string
                        e1_loja:
                          type: string
                        e1_naturez:
                          type: string
                        e1_emissao:
                          type: string
                        e1_vencto:
                          type: string
                        e1_vencrea:
                          type: string
                        e1_valor:
                          type: number
                        e1_saldo:
                          type: number
                        e1_baixa:
                          type: string
                        e1_portado:
                          type: string
                        e1_situaca:
                          type: string
                        e1_vend1:
                          type: string
                        e1_hist:
                          type: string
                  hasNext:
                    type: boolean
                  remainingRecords:
                    type: integer
                  protectedDataFields:
                    type: array
                    items: {}
                  nivelFields:
                    type: array
                    items: {}
              example:
                items:
                - e1_filial: '01'
                  e1_prefixo: NF
                  e1_num: '000123456'
                  e1_parcela: A
                  e1_tipo: NF
                  e1_cliente: '000001'
                  e1_loja: '01'
                  e1_naturez: '1010001'
                  e1_emissao: '2026-08-05'
                  e1_vencto: '2026-09-04'
                  e1_vencrea: '2026-09-04'
                  e1_valor: 1500.0
                  e1_saldo: 1500.0
                  e1_baixa: ''
                  e1_portado: '341'
                  e1_situaca: '1'
                  e1_vend1: '000010'
                  e1_hist: VENDA PEDIDO 004512
                hasNext: true
                remainingRecords: 1240
                protectedDataFields: []
                nivelFields: []
        '401':
          description: Não autorizado — Usuário ou senha inválidos, token vencido, ou tenantId com uma filial à
            qual o usuário não tem acesso.
        '404':
          description: Not Found (no REST 2.0 a página vem em HTML) — Endereço errado (falta /rest, barra duplicada)
            ou serviço inexistente na LIB do cliente.
        '503':
          description: Serviço indisponível — REST com consumo de licença por demanda (Stateless=1) e nenhuma licença
            livre no License Server.
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/display/public/framework/GenericQuery
      x-data-consulta: '2026-10-19'
      x-entidade-canonica: ContaReceber
      x-acao-canonica: listar
      x-parametros-fixos:
        tables: SE1
        fields: e1_filial,e1_prefixo,e1_num,e1_parcela,e1_tipo,e1_cliente,e1_loja,e1_naturez,e1_emissao,e1_vencto,e1_vencrea,e1_valor,e1_saldo,e1_baixa,e1_portado,e1_situaca,e1_vend1,e1_hist
      x-url-real: /api/framework/v1/genericQuery
  /api/framework/v1/genericQuery#SE2:
    get:
      operationId: totvs-protheus__conta_pagar__listar
      summary: Títulos a pagar — tabela SE2 (Contas a Pagar) pela API genericQuery
      description: 'Lista os títulos do contas a pagar (SE2) com prefixo, número, parcela, tipo, fornecedor e loja,
        natureza, emissão, vencimentos, valor, saldo, data da baixa, centro de custo e histórico.


        Quando usar: Para programação de pagamentos, fluxo de caixa de saídas, contas vencidas e gasto por natureza
        ou centro de custo. Recorte por E2_VENCREA e use ''Só títulos em aberto'' para o que ainda vai sair do caixa.
        Quando não usar: Não use para conferir o que saiu do banco num dia: os pagamentos efetivos estão nas baixas
        da SE5 (totvs-protheus.pagamento.listar.baixas) e nos movimentos bancários.'
      tags:
      - ContaPagar
      parameters:
      - name: tables
        in: query
        required: true
        description: 'Alias da tabela a consultar. Nesta receita é fixo: SE2 (Contas a Pagar).'
        schema:
          type: string
          default: SE2
      - name: fields
        in: query
        required: false
        description: Campos a devolver, separados por vírgula, com o nome físico do campo (minúsculo, como nos exemplos
          oficiais). Sem fields a API devolve todos os campos que o usuário pode ver.
        schema:
          type: string
          default: e2_filial,e2_prefixo,e2_num,e2_parcela,e2_tipo,e2_fornece,e2_loja,e2_naturez,e2_emissao,e2_vencto,e2_vencrea,e2_valor,e2_saldo,e2_baixa,e2_ccusto,e2_hist
      - name: where
        in: query
        required: false
        description: Filtro SQL acrescentado à consulta. Datas são texto AAAAMMDD entre aspas simples; valores de
          texto também entre aspas simples. Combine condições com AND.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página, começando em 1.
        schema:
          type: integer
          default: 1
      - name: pagesize
        in: query
        required: false
        description: Registros por página. Teto não publicado; use 100.
        schema:
          type: integer
          default: 100
      - name: filialFilter
        in: query
        required: false
        description: Filtra pela filial ([ALIAS]_FILIAL) correspondente ao tenantId. Padrão true.
        schema:
          type: boolean
          default: true
      - name: deletedFilter
        in: query
        required: false
        description: Filtra registros excluídos logicamente (D_E_L_E_T_). Padrão true; não desligue em relatórios.
        schema:
          type: boolean
          default: true
      - name: order
        in: query
        required: false
        description: 'Ordenação: lista de campos separada por vírgula; ''-'' antes do campo inverte. Nome do parâmetro
          conforme o guia de APIs TOTVS e a classe FWAdapterBaseV2, base da genericQuery.'
        schema:
          type: string
      - name: tenantId
        in: header
        required: false
        description: 'Grupo de empresas e filial em que a consulta roda, no formato <grupo>,<filial> (ex.: T1,D
          MG 01). Pode ir só o grupo.'
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        e2_filial:
                          type: string
                        e2_prefixo:
                          type: string
                        e2_num:
                          type: string
                        e2_parcela:
                          type: string
                        e2_tipo:
                          type: string
                        e2_fornece:
                          type: string
                        e2_loja:
                          type: string
                        e2_naturez:
                          type: string
                        e2_emissao:
                          type: string
                        e2_vencto:
                          type: string
                        e2_vencrea:
                          type: string
                        e2_valor:
                          type: number
                        e2_saldo:
                          type: number
                        e2_baixa:
                          type: string
                        e2_ccusto:
                          type: string
                        e2_hist:
                          type: string
                  hasNext:
                    type: boolean
                  remainingRecords:
                    type: integer
                  protectedDataFields:
                    type: array
                    items: {}
                  nivelFields:
                    type: array
                    items: {}
              example:
                items:
                - e2_filial: '01'
                  e2_prefixo: CMP
                  e2_num: '000004521'
                  e2_parcela: '1'
                  e2_tipo: NF
                  e2_fornece: '000245'
                  e2_loja: '01'
                  e2_naturez: '2010003'
                  e2_emissao: '2026-08-02'
                  e2_vencto: '2026-08-30'
                  e2_vencrea: '2026-08-31'
