    get:
      operationId: mercado-livre__contestacao__listar
      summary: Buscar reclamações (/post-purchase/v1/claims/search)
      description: 'Busca reclamações, mediações, devoluções, cancelamentos e trocas em que o vendedor é parte, com etapa, motivo, recurso afetado (pedido,
        envio, pagamento), ações pendentes com prazo e resolução.


        Quando usar: Planilha de pós-venda por período: players.user_id + players.role=respondent e range por date_created. Quando não usar: o detalhe da
        devolução (envio de retorno, dinheiro retido) está em /post-purchase/v2/claims/{id}/returns.


        Armadilhas: Datas do range precisam de milissegundos (2026-08-01T00:00:00.000-0300). status=opened sozinho é aceito mas caro e pode levar a rate
        limit/bloqueio. O exemplo oficial usa type returns enquanto a tabela lista return: confira o valor aceito. Players.user_id sempre com players.role.'
      tags:
      - Contestacao
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/gerenciar-reclamacoes
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.contestacao.listar
      x-entidade-canonica: Contestacao
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: players.user_id
        in: query
        required: false
        description: ID do usuário parte da reclamação; exige players.role.
        schema:
          type: integer
      - name: players.role
        in: query
        required: false
        description: Papel do usuário; exige players.user_id.
        schema:
          type: string
          enum:
          - complainant
          - respondent
      - name: status
        in: query
        required: false
        description: Situação. Não use como único filtro.
        schema:
          type: string
          enum:
          - opened
          - closed
      - name: type
        in: query
        required: false
        description: Tipo.
        schema:
          type: string
          enum:
          - mediations
          - return
          - fulfillment
          - ml_case
          - cancel_sale
          - cancel_purchase
          - change
          - service
      - name: stage
        in: query
        required: false
        description: Etapa.
        schema:
          type: string
          enum:
          - claim
          - dispute
          - recontact
          - stale
          - none
      - name: reason_id
        in: query
        required: false
        description: Motivo (prefixos PNR produto não recebido, PDD diferente/defeituoso, CS compra cancelada).
        schema:
          type: string
      - name: resource
        in: query
        required: false
        description: Recurso; exige resource_id ou players.role + players.user_id.
        schema:
          type: string
          enum:
          - shipment
          - payment
          - order
          - purchase
      - name: resource_id
        in: query
        required: false
        description: Id do recurso; exige resource.
        schema:
          type: integer
      - name: order_id
        in: query
        required: false
        description: Pedido (não combinar com pack_id).
        schema:
          type: integer
      - name: pack_id
        in: query
        required: false
        description: Pack (não combinar com order_id).
        schema:
          type: integer
      - name: payment_id
        in: query
        required: false
        description: Pagamento (convertido para order_id).
        schema:
          type: integer
      - name: range
        in: query
        required: false
        description: 'Intervalo de datas: campo:after:data,before:data (date_created ou last_updated). Datas com milissegundos. Formato: date_created:after:AAAA-MM-DDThh:mm:ss.000-0300,before:AAAA-MM-DDThh:mm:ss.000-0300.'
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: 'campo:asc ou campo:desc (ex.: date_created:desc).'
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Máximo 9999; offset + limit precisa ser menor que 10000.
        schema:
          type: integer
          default: 0
          maximum: 9999
      - name: limit
        in: query
        required: false
        description: Padrão 30, máximo 100 (acima é ajustado para 100).
        schema:
          type: integer
          default: 30
          maximum: 100
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                paging:
                  total: 1
                  offset: 0
                  limit: 100
                data:
                - id: 5300000001
                  resource_id: 2000012345678901
                  status: opened
                  type: mediations
                  stage: claim
                  parent_id: null
                  resource: order
                  reason_id: PDD9549
                  fulfilled: true
                  quantity_type: total
                  players:
                  - role: complainant
                    type: buyer
                    user_id: 9876543210
                    available_actions: []
                  - role: respondent
                    type: seller
                    user_id: 1234567890
                    available_actions:
                    - action: send_message_to_complainant
                      mandatory: true
                      due_date: '2026-08-12T23:59:00.000-04:00'
