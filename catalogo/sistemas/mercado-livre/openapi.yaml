  /missed_feeds:
    get:
      operationId: mercado-livre__webhook__listar__perdidas
      summary: Histórico das notificações (/missed_feeds)
      description: 'Notificações que não foram aceitas pelo callback depois de 8 tentativas em 1 hora, guardadas por até 2 dias, com o pedido enviado e
        a resposta do servidor.


        Quando usar: Recuperar eventos perdidos quando o callback ficou fora do ar. Quando não usar: não substitui a busca de dados; depois de ler o resource,
        consulte o recurso.


        Armadilhas: Só 2 dias de histórico. Desde 15/06/2026 o Mercado Livre desativa as notificações de aplicações com mais de 80% de erro; durante a desativação
        nada vai para o missed_feeds.'
      tags:
      - Webhook
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/produto-receba-notificacoes
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.webhook.listar.perdidas
      x-entidade-canonica: Webhook
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: app_id
        in: query
        required: true
        description: ID do aplicativo.
        schema:
          type: integer
      - name: topic
        in: query
        required: false
        description: 'Filtra por tópico (ex.: orders_v2, items, questions).'
        schema:
          type: string
      - name: site_id
        in: query
        required: false
        description: 'Obrigatório quando topic=items (ex.: MLB); sem ele, 400.'
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Deslocamento.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: false
        description: Quantidade (exemplo usa 10).
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                messages:
                - _id: 5da8a1b24be30a49eb66c52a
                  resource: /orders/2000012345678901
                  user_id: 1234567890
                  topic: orders_v2
                  application_id: 1111111111111111
                  attempts: 8
                  sent: '2026-08-03T17:15:30.279Z'
                  received: '2026-08-03T17:15:30.259Z'
                  response:
                    req_time: 260
                    http_code: 500
        '401':
          description: invalid access token / authorization value not present — Token ausente, expirado (vale 6 horas) ou invalidado (troca de senha, renovação
            do Client Secret, revogação pelo vendedor, 4 meses sem uso).
        '403':
          description: FORBIDDEN / PA_UNAUTHORIZED_RESULT_FROM_POLICIES access to the requested resource is forbidden / At least one policy returned UNAUTHORIZED.
            — Token de outro usuário, permissão funcional não habilitada no DevCenter, scope faltando, IP fora da lista, usuário inativo ou com validação
            de dados pendente, aplicação bloqueada.
        '429':
          description: local_rate_limited Too Many Requests — Excesso de requisições em pouco tempo. O controle é principalmente por Client ID e por endpoint;
            o número não é publicado.
        '400':
          description: Bad Request — topic=items sem site_id.
