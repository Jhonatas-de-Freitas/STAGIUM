openapi: 3.1.0
info:
  title: Mercado Livre — API de marketplace (recorte do catálogo, site MLB)
  version: sem versão publicada; consultado em 2026-10-14
  summary: Reconstrução das leituras de vendas, envios, anúncios, estoque, perguntas, pós-venda, faturamento, notas, visitas e reputação.
  description: Reconstruído a partir do portal oficial https://developers.mercadolivre.com.br/pt_br/api-docs-pt-br, lido em 2026-10-14. Descrições autorais;
    caminhos, parâmetros e campos são fatos técnicos. O Mercado Livre não publica OpenAPI. As demais operações estão em endpoints.json > endpoints_secundarios.
  contact:
    name: Suporte para integradores
    url: https://developers.mercadolivre.com.br/pt_br/suporte-para-integradores
  x-fonte-url: https://developers.mercadolivre.com.br/pt_br/api-docs-pt-br
  x-data-consulta: '2026-10-14'
externalDocs:
  description: Autenticação e Autorização
  url: https://developers.mercadolivre.com.br/pt_br/autenticacao-e-autorizacao
servers:
- url: https://api.mercadolibre.com
  description: Produção (única URL).
- url: https://api.mercadolibre.com
  description: 'Testes: a mesma URL, com usuários de teste (POST /users/test_user); não existe sandbox.'
x-sandbox: Não há sandbox; testes com usuários de teste em produção (até 10 por conta).
x-limite-requisicoes: 'Sem número global publicado; controle por Client ID e endpoint; 429 local_rate_limited. Mensageria: 500 rpm. Faturamento: 429 por
  IP.'
security:
- oauth2:
  - read
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authorization code. Access token de 6 horas; refresh_token de uso único (rotativo).
      flows:
        authorizationCode:
          authorizationUrl: https://auth.mercadolivre.com.br/authorization
          tokenUrl: https://api.mercadolibre.com/oauth/token
          refreshUrl: https://api.mercadolibre.com/oauth/token
          scopes:
            read: Leitura (métodos GET)
            write: Escrita (PUT, POST, DELETE)
            offline_access: Emite refresh_token para operar sem o usuário presente
paths:
  /oauth/token:
    post:
      operationId: mercado-livre__autenticacao__autenticar
      summary: Trocar o code por um token / Refresh token
      description: 'Emite o par access_token + refresh_token. Com grant_type=authorization_code troca o code recebido no redirect_uri depois que o vendedor
        autoriza o aplicativo; com grant_type=refresh_token renova o access_token vencido sem nova interação do vendedor.


        Quando usar: Na conexão inicial da conta do vendedor (troca do code) e sempre que o access_token expirar (6 horas). Quando não usar: não é consulta
        de dados; o executor chama esta rota só dentro da renovação de token, nunca como pedido do usuário. Não renove antes de vencer: a doc recomenda
        renovar apenas quando o token perder a validade.


        Armadilhas: O refresh_token é de uso único e só o último emitido vale: duas renovações em paralelo derrubam a conexão. O usuário que autoriza precisa
        ser o administrador da conta (colaborador gera invalid_operator_user_id). Parâmetros vão no corpo form-urlencoded, nunca na URL.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/autenticacao-e-autorizacao
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.autenticacao.autenticar
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      x-seguro-para-executar: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                access_token: APP_USR-<<ACCESS_TOKEN_DE_EXEMPLO>>
                token_type: bearer
                expires_in: 21600
                scope: offline_access read write
                user_id: 1234567890
                refresh_token: TG-<<REFRESH_TOKEN_DE_EXEMPLO>>
        '400':
          description: invalid_grant Error validating grant. Your authorization code or refresh token may be expired or it was already used — code ou refresh_token
            inválido, já usado, expirado (refresh dura 6 meses), revogado, de outro client_id, redirect_uri diferente do cadastrado ou vendedor com dados
            pendentes.
        '403':
          description: forbidden forbidden — Token de outro usuário, IP bloqueado ou scopes faltando.
        '429':
          description: local_rate_limited Too Many Requests — Excesso de requisições em pouco tempo. O controle é principalmente por Client ID e por endpoint;
            o número não é publicado.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - authorization_code
                  - refresh_token
                  description: Tipo de troca.
                client_id:
                  type: string
                  description: APP ID do aplicativo criado no DevCenter.
                client_secret:
                  type: string
                  description: Secret Key do aplicativo (DevCenter > aplicativo > Configurações).
                code:
                  type: string
                  description: 'Obrigatório com authorization_code: código devolvido no redirect_uri após a autorização (formato TG-...).'
                redirect_uri:
                  type: string
                  description: 'Obrigatório com authorization_code: a mesma URL cadastrada no aplicativo, sem partes variáveis.'
                code_verifier:
                  type: string
                  description: Só quando o PKCE está habilitado no aplicativo (aí passa a ser obrigatório).
                refresh_token:
                  type: string
                  description: 'Obrigatório com refresh_token: o último refresh_token emitido. É de uso único.'
              required:
              - grant_type
              - client_id
              - client_secret
  /users/me:
    get:
      operationId: mercado-livre__empresa__obter__usuario_atual
      summary: Consultar meus dados pessoais (/users/me)
      description: 'Devolve a conta dona do access_token: id (que é o seller_id usado em quase todas as buscas), apelido, site, tipo de usuário, tags e
        o resumo da reputação.


        Quando usar: Primeira chamada depois de conectar a conta: descobre o seller_id e confirma que o token é do vendedor certo. Quando não usar: para
        dados de outro usuário use GET /users/{user_id}; para métricas de reputação dos últimos 60 dias o mesmo /users/{user_id} traz o bloco metrics.


        Armadilhas: Os ids de usuário novos passam do limite de Int32: guarde como inteiro de 64 bits ou texto. O user_id também volta na resposta do /oauth/token.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/consulta-de-usuarios
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.empresa.obter.usuario_atual
      x-entidade-canonica: Empresa
      x-acao-canonica: obter
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                id: 1234567890
                nickname: LOJAEXEMPLO
                registration_date: '2019-03-10T09:15:00.000-04:00'
                first_name: Loja
                last_name: Exemplo
                country_id: BR
                email: contato@example.com
                user_type: normal
                tags:
                - normal
                - user_product_seller
                site_id: MLB
                permalink: http://perfil.mercadolivre.com.br/LOJAEXEMPLO
                seller_reputation:
                  level_id: 5_green
                  power_seller_status: gold
                  transactions:
                    period: historic
                    total: 1520
                    completed: 1480
                    canceled: 40
                    ratings:
                      positive: 0.96
                      negative: 0.02
                      neutral: 0.02
                status:
                  site_status: active
        '401':
          description: invalid access token / authorization value not present — Token ausente, expirado (vale 6 horas) ou invalidado (troca de senha, renovação
            do Client Secret, revogação pelo vendedor, 4 meses sem uso).
        '403':
          description: FORBIDDEN / PA_UNAUTHORIZED_RESULT_FROM_POLICIES access to the requested resource is forbidden / At least one policy returned UNAUTHORIZED.
            — Token de outro usuário, permissão funcional não habilitada no DevCenter, scope faltando, IP fora da lista, usuário inativo ou com validação
            de dados pendente, aplicação bloqueada.
        '429':
          description: local_rate_limited Too Many Requests — Excesso de requisições em pouco tempo. O controle é principalmente por Client ID e por endpoint;
            o número não é publicado.
  /users/{user_id}:
    get:
      operationId: mercado-livre__empresa__obter
      summary: Reputação de vendedores (/users/{user_id})
      description: 'Dados da conta de um usuário. Para o próprio vendedor, inclui seller_reputation com nível (termômetro), MercadoLíder, totais históricos
        e o bloco metrics dos últimos 60 dias (vendas, reclamações, atrasos de despacho e cancelamentos, com taxa e quantidade).


        Quando usar: Planilha de saúde da conta: nível de reputação e as três métricas que derrubam o termômetro. Quando não usar: para obter o próprio
        seller_id prefira /users/me.


        Armadilhas: Vendedor em período de proteção mostra rate/value zerados e os números reais no subcampo excluded (real_value, real_rate) e real_level.
        As taxas vêm como fração decimal (0.02 = 2%), conforme o exemplo oficial.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/reputacao-de-vendedores
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.empresa.obter
      x-entidade-canonica: Empresa
      x-acao-canonica: obter
      x-seguro-para-executar: true
      parameters:
      - name: user_id
        in: path
        required: true
        description: ID do usuário (para o próprio vendedor, o id de /users/me).
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                id: 1234567890
                nickname: LOJAEXEMPLO
                seller_reputation:
                  level_id: 5_green
                  power_seller_status: platinum
                  transactions:
                    canceled: 30
                    completed: 2100
                    period: historic
                    ratings:
                      negative: 0.03
                      neutral: 0.05
                      positive: 0.92
                    total: 2130
                  metrics:
                    sales:
                      period: 60 days
                      completed: 240
                    claims:
                      period: 60 days
                      rate: 0.01
                      value: 2
                    delayed_handling_time:
                      period: 60 days
                      rate: 0.02
                      value: 5
                    cancellations:
                      period: 60 days
                      rate: 0
                      value: 0
        '401':
          description: invalid access token / authorization value not present — Token ausente, expirado (vale 6 horas) ou invalidado (troca de senha, renovação
            do Client Secret, revogação pelo vendedor, 4 meses sem uso).
        '403':
          description: FORBIDDEN / PA_UNAUTHORIZED_RESULT_FROM_POLICIES access to the requested resource is forbidden / At least one policy returned UNAUTHORIZED.
            — Token de outro usuário, permissão funcional não habilitada no DevCenter, scope faltando, IP fora da lista, usuário inativo ou com validação
            de dados pendente, aplicação bloqueada.
        '429':
          description: local_rate_limited Too Many Requests — Excesso de requisições em pouco tempo. O controle é principalmente por Client ID e por endpoint;
            o número não é publicado.
  /orders/search:
    get:
      operationId: mercado-livre__pedido__listar
      summary: Consultar orders (/orders/search)
      description: 'Busca as vendas (orders) do vendedor com filtros por situação, datas de criação, de confirmação e de última alteração, item, tags e
        texto livre. Cada resultado traz itens, pagamentos, comprador (só id), pack e id do envio.


        Quando usar: Planilha de vendas por período: recorte por order.date_created (ou date_closed) e, se quiser só vendas pagas, order.status=paid. Quando
        não usar: para custo de frete, endereço e rastreio use GET /shipments/{id}; para tarifas faturadas pelo Mercado Livre use os relatórios de faturamento;
        para dados fiscais do comprador há o recurso billing-info.


        Armadilhas: Os pedidos ficam disponíveis por até 12 meses. A doc diz que a busca como vendedor continua filtrando os pedidos cancelados (texto ambíguo:
        confira se cancelados aparecem). O filtro de data considera só a hora. comprador vem só com id. Pedidos de teste trazem a tag test_order. Uma venda
        de carrinho tem vários pedidos ligados pelo pack_id.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/gerenciamento-de-vendas
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.pedido.listar
      x-entidade-canonica: Pedido
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: seller
        in: query
        required: true
        description: ID do vendedor (seller_id de /users/me). A busca não faz nada sem pelo menos um filtro.
        schema:
          type: integer
      - name: order.status
        in: query
        required: false
        description: Situação; aceita vários valores separados por vírgula.
        schema:
          type: string
          enum:
          - confirmed
          - payment_required
          - payment_in_process
          - partially_paid
          - paid
          - partially_refunded
          - pending_cancel
          - cancelled
          - invalid
      - name: order.date_created.from
        in: query
        required: false
        description: 'Início do período pela data de criação. Formato: AAAA-MM-DDThh:mm:ss.000-03:00.'
        schema:
          type: string
      - name: order.date_created.to
        in: query
        required: false
        description: 'Fim do período pela data de criação. Formato: AAAA-MM-DDThh:mm:ss.000-03:00.'
        schema:
          type: string
      - name: order.date_closed.from
        in: query
        required: false
        description: 'Início pela data de confirmação (primeira mudança para confirmed/paid). Formato: AAAA-MM-DDThh:mm:ss.000-03:00.'
        schema:
          type: string
      - name: order.date_closed.to
        in: query
        required: false
        description: 'Fim pela data de confirmação. Formato: AAAA-MM-DDThh:mm:ss.000-03:00.'
        schema:
          type: string
      - name: order.date_last_updated.from
        in: query
        required: false
        description: 'Início pela data da última modificação (bom para extração incremental). Formato: AAAA-MM-DDThh:mm:ss.000-03:00.'
        schema:
          type: string
      - name: order.date_last_updated.to
        in: query
        required: false
        description: 'Fim pela data da última modificação. Formato: AAAA-MM-DDThh:mm:ss.000-03:00.'
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Busca livre por id do pedido, id ou título do item, ou apelido da contraparte (não procura nome nem e-mail).
        schema:
          type: string
      - name: item
        in: query
        required: false
        description: ID ou título do item.
        schema:
          type: string
      - name: tags
        in: query
        required: false
        description: Tags exigidas, separadas por vírgula.
        schema:
          type: string
      - name: tags.not
        in: query
        required: false
        description: Tags excluídas, separadas por vírgula.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Ordenação. Padrão date_asc (para vendedor, por date_closed).
        schema:
          type: string
          enum:
          - date_asc
          - date_desc
          default: date_asc
      - name: offset
        in: query
        required: false
        description: Deslocamento da paginação.
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Registros por página. Os exemplos oficiais devolvem limit 50; o máximo não é publicado.
        schema:
          type: integer
          default: 50
          minimum: 1
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                query: null
                results:
                - id: 2000012345678901
                  date_created: '2026-08-03T14:20:11.000-04:00'
                  date_closed: '2026-08-03T14:20:15.000-04:00'
                  last_updated: '2026-08-05T09:01:00.000-04:00'
                  pack_id: 2000009876543210
                  status: paid
                  status_detail: null
                  total_amount: 189.9
                  paid_amount: 189.9
                  currency_id: BRL
                  order_items:
                  - item:
                      id: MLB4000000001
                      title: Garrafa térmica 1 L
                      category_id: MLB0000
                      variation_id: null
                      seller_sku: GT-1L
                    quantity: 1
                    unit_price: 189.9
                    sale_fee: 22.79
                    listing_type_id: gold_special
                    currency_id: BRL
                  payments:
                  - id: 900000000001
                    status: approved
                    transaction_amount: 189.9
                    payment_type: credit_card
                    installments: 3
                    date_approved: '2026-08-03T14:20:14.000-04:00'
                  shipping:
                    id: 450000000001
                  buyer:
                    id: 9876543210
                  seller:
                    id: 1234567890
                  tags:
                  - paid
                  - not_delivered
                  context:
                    channel: marketplace
                    site: MLB
                    flows: []
                sort:
                  id: date_desc
                  name: Date descending
                available_sorts:
                - id: date_asc
                  name: Date ascending
                filters: []
                paging:
                  total: 1
                  offset: 0
                  limit: 50
                display: complete
        '401':
          description: invalid access token / authorization value not present — Token ausente, expirado (vale 6 horas) ou invalidado (troca de senha, renovação
            do Client Secret, revogação pelo vendedor, 4 meses sem uso).
        '403':
          description: FORBIDDEN / PA_UNAUTHORIZED_RESULT_FROM_POLICIES access to the requested resource is forbidden / At least one policy returned UNAUTHORIZED.
            — Token de outro usuário, permissão funcional não habilitada no DevCenter, scope faltando, IP fora da lista, usuário inativo ou com validação
            de dados pendente, aplicação bloqueada.
        '429':
          description: local_rate_limited Too Many Requests — Excesso de requisições em pouco tempo. O controle é principalmente por Client ID e por endpoint;
            o número não é publicado.
        '206':
          description: Partial Content (cabeçalho X-Content-Missing) — Algum dado não pôde ser obtido; o cabeçalho X-Content-Missing lista os campos afetados.
  /orders/{order_id}:
    get:
      operationId: mercado-livre__pedido__obter
      summary: Receba uma ordem (/orders/{order_id})
      description: 'Detalhe de uma venda: datas, situação, itens com preço unitário, quantidade, tarifa de venda (sale_fee) e gross_price, pagamentos, id
        do envio, pack, tags, contexto (canal e fluxos) e, se houver, cancel_detail.


        Quando usar: Para completar uma linha da planilha de vendas ou conferir uma venda específica recebida por notificação orders_v2. Quando não usar:
        para várias vendas de um período use /orders/search, que já traz o mesmo objeto.


        Armadilhas: A comissão é calculada quando o pagamento é creditado, não na criação. gross_price pode faltar em pedidos antigos. Pedido com a tag
        fraud_risk_detected não deve ser enviado. Pedido não concretizado pelo vendedor aparece no site como cancelado, mas pela API com status confirmed.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/gerenciamento-de-vendas
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.pedido.obter
      x-entidade-canonica: Pedido
      x-acao-canonica: obter
      x-seguro-para-executar: true
      parameters:
      - name: order_id
        in: path
        required: true
        description: ID do pedido (Long).
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                id: 2000012345678901
                date_created: '2026-08-03T14:20:11.000-04:00'
                date_closed: '2026-08-03T14:20:15.000-04:00'
                last_updated: '2026-08-05T09:01:00.000-04:00'
                pack_id: 2000009876543210
                status: paid
                status_detail: null
                total_amount: 189.9
                paid_amount: 189.9
                currency_id: BRL
                order_items:
                - item:
                    id: MLB4000000001
                    title: Garrafa térmica 1 L
                    category_id: MLB0000
                    variation_id: null
                    seller_sku: GT-1L
                  quantity: 1
                  unit_price: 189.9
                  sale_fee: 22.79
                  listing_type_id: gold_special
                  currency_id: BRL
                payments:
                - id: 900000000001
                  status: approved
                  transaction_amount: 189.9
                  payment_type: credit_card
                  installments: 3
                  date_approved: '2026-08-03T14:20:14.000-04:00'
                shipping:
                  id: 450000000001
                buyer:
                  id: 9876543210
                seller:
                  id: 1234567890
                tags:
                - paid
                - not_delivered
                context:
                  channel: marketplace
                  site: MLB
                  flows: []
        '401':
          description: invalid access token / authorization value not present — Token ausente, expirado (vale 6 horas) ou invalidado (troca de senha, renovação
            do Client Secret, revogação pelo vendedor, 4 meses sem uso).
        '403':
          description: FORBIDDEN / PA_UNAUTHORIZED_RESULT_FROM_POLICIES access to the requested resource is forbidden / At least one policy returned UNAUTHORIZED.
            — Token de outro usuário, permissão funcional não habilitada no DevCenter, scope faltando, IP fora da lista, usuário inativo ou com validação
            de dados pendente, aplicação bloqueada.
        '429':
          description: local_rate_limited Too Many Requests — Excesso de requisições em pouco tempo. O controle é principalmente por Client ID e por endpoint;
            o número não é publicado.
        '206':
          description: Partial Content — Dados faltantes listados em X-Content-Missing.
  /orders/{order_id}/discounts:
    get:
      operationId: mercado-livre__pedido__obter__descontos
      summary: Obter descontos aplicados em uma venda
      description: 'Lista os descontos que afetaram a venda (campanha/promoção, cupom, cashback), com o valor total por item e a parte bancada pelo vendedor.


        Quando usar: Margem por venda: separar quanto do desconto saiu do bolso do vendedor (amounts.seller). Quando não usar: não inclui taxas adicionais
        nem reembolsos posteriores; para tarifas cobradas use os relatórios de faturamento.


        Armadilhas: Os valores são por item já multiplicados pela quantidade (p × q). Pedidos com mais de 12 meses não são guardados.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://developers.mercadolivre.com.br/pt_br/gerenciamento-de-vendas
      x-data-consulta: '2026-10-14'
      x-id-canonico: mercado-livre.pedido.obter.descontos
      x-entidade-canonica: Pedido
      x-acao-canonica: obter
      x-seguro-para-executar: true
      parameters:
      - name: order_id
        in: path
        required: true
        description: ID do pedido.
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                details:
                - type: discount
                  supplier:
                    offer_id: MLB4000000001-abc123
                    funding_mode: sale_fee
                  items:
                  - id: MLB4000000001
                    quantity: 1
                    amounts:
                      total: 20.0
                      seller: 10.0
        '401':
          description: invalid access token / authorization value not present — Token ausente, expirado (vale 6 horas) ou invalidado (troca de senha, renovação
