# TOTVS WinThor — OpenAPI reconstruída pelo catálogo (não oficial). Fonte: https://tdn.totvs.com/pages/releaseview.action?pageId=573185595
openapi: 3.1.0
info:
  title: TOTVS WinThor — APIs do WinThor Anywhere (reconstruída)
  version: '2026-10-19'
  description: 'Spec reconstruída pelo catálogo a partir da TDN e das coleções Postman oficiais; não é publicada pela TOTVS. A API roda no servidor
    do cliente. Autenticação: POST /winthor/autenticacao/v1/login devolve accessToken (JWT, 4 h) e grava cookie de sessão; o esquema Bearer abaixo
    é o transporte documentado só para a liberação de pedido.'
  x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=573185595
servers:
- url: http://{host}:{porta}
  description: 'Produção: WinThor Anywhere (WTA) do cliente'
  variables:
    host:
      default: localhost
      description: IP ou nome do servidor do WTA (parâmetro 2851 da rotina 132)
    porta:
      default: '8181'
      description: Porta do WTA (org.ops4j.pax.web.cfg / parâmetro 2849); exemplos oficiais usam 8181, 8889 e 8282
- url: http://{host}:{porta}
  description: 'Homologação: base de testes do próprio cliente (não há sandbox público)'
  variables:
    host:
      default: localhost
    porta:
      default: '8181'
security:
- sessaoWTA: []
components:
  securitySchemes:
    sessaoWTA:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'accessToken do login. Transporte documentado: cookie gravado pelo WTA (nome não publicado). Bearer documentado só na API de
        liberação de pedido.'
paths:
  /winthor/autenticacao/v1/login:
    post:
      operationId: totvs-winthor__autenticacao__autenticar
      summary: Usuário - Login
      description: 'Abre a sessão nas APIs do WinThor com login e senha de um usuário do ERP. A senha não vai em texto: vai como hash MD5 hexadecimal
        em maiúsculas da senha do WTA convertida para maiúsculas. Devolve accessToken (JWT) e o WTA guarda a sessão em cookie, válida por 4 horas.
        Quando usar: Antes de qualquer outra chamada às APIs do WinThor e de novo a cada 4 horas ou depois de um 403. Quando não usar: não é preciso
        chamar as APIs de saúde (health), que dispensam login.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=644722134
      x-servico-wta: WTA (serviços da página 'Parametrizações WTA')
      x-seguro-para-executar: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: Login do usuário do WinThor criado para a integração (o mesmo usado no WTA). Use usuário dedicado, com o mínimo
                    de rotinas liberadas na 530.
                senha:
                  type: string
                  pattern: ^[0-9A-F]{32}$
                  description: 'Hash MD5 hexadecimal, em letras maiúsculas, da senha do WTA previamente convertida para maiúsculas. Exemplo publicado
                    pela TOTVS: a senha ''Totvs@123'' vira ''TOTVS@123'' e depois o MD5 29F7F1E7DF1C2500C86561185392F280. Prefira calcular o hash
                    localmente a usar sites de MD5.'
              required:
              - login
              - senha
            example:
              login: <<USUARIO_DE_INTEGRACAO>>
              senha: <<SENHA_EM_MD5_MAIUSCULO>>
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                accessToken: <<TOKEN_JWT_DEVOLVIDO_PELO_WTA>>
        '404':
          description: Error 404 Not Found / Problem accessing — Porta errada ou indisponível; o IP e a porta da API são os mesmos do WTA.
  /winthor/autenticacao/v1/logout:
    get:
      operationId: totvs-winthor__autenticacao__autenticar__logout
      summary: Usuário - Logout
      description: 'Encerra a sessão aberta pelo login, invalidando o uso do token/cookie a partir dali. Quando usar: Ao terminar uma extração,
        para não deixar sessão aberta no WTA. Quando não usar: no meio de uma paginação, porque as páginas seguintes passariam a receber 403.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=644722134
      x-servico-wta: WTA
      x-seguro-para-executar: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example: {}
        '404':
          description: 'HTML do Jetty: "HTTP ERROR 404 Problem accessing <caminho>. Reason: Not Found" — Serviço do WTA que atende a rota não
            está instalado ou ativo, ou a porta informada não é a do WTA.'
  /api/wholesale/v1/orders/list:
    get:
      operationId: totvs-winthor__pedido__listar
      summary: Listar Pedidos (winthor-pedido-venda)
      description: 'Lista pedidos de venda de uma ou mais filiais, paginados: cabeçalho (cliente, posição, origem, plano, cobrança, total), itens
        (produto, quantidade, preço, custos) e, se pedido, a NF de saída e as devoluções. Quando usar: Para planilha de vendas, carteira de pedidos
        e conferência de NF emitida (viewDocument=true). Recorte por branchId e período (daysOfSearch, lastChange). Quando não usar: para um pedido
        só use pedido.obter; títulos financeiros da venda não têm API pública.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=632099891
      x-servico-wta: winthor-pedido-venda
      x-seguro-para-executar: true
      parameters:
      - name: branchId
        in: query
        required: true
        schema:
          type: string
          description: Código da filial; aceita várias separadas por vírgula.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
          description: Número da página.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Pedidos por página. Máximo não publicado; a coleção oficial usa até 70000 num exemplo.
      - name: daysOfSearch
        in: query
        required: false
        schema:
          type: integer
          default: 15
          description: Janela de busca em dias contados para trás, sobre a data de alteração do pedido. Sem o parâmetro só vêm pedidos alterados
            nos últimos 15 dias, mesmo que criados antes.
      - name: lastChange
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: Data/hora da última alteração a partir da qual buscar.
      - name: orderId
        in: query
        required: false
        schema:
          type: integer
          description: Número do pedido (PCPEDC.NUMPED).
      - name: saleOrigin
        in: query
        required: false
        schema:
          type: string
          enum:
          - B
          - R
          - K
          - C
          - F
          - T
          - W
          - A
          default: W
          description: 'Origem do pedido no WinThor. B balcão, R balcão reserva, K broker, C call center, F força de vendas, T telemarketing,
            W web, A autosserviço. O padrão é W: sem informar, só pedidos web.'
      - name: orderStatus
        in: query
        required: false
        schema:
          type: string
          description: 'Posição do pedido (PCPEDC.POSICAO), ex.: L liberado, B bloqueado. A tabela completa de posições está num artigo da Central
            de Atendimento citado pela TDN.'
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: lastChange
          description: Campo de ordenação da busca.
      - name: customerId
        in: query
        required: false
        schema:
          type: integer
          description: Código do cliente. Aparece na coleção Postman oficial, não na página da TDN.
      - name: hasOrderIdHube
        in: query
        required: false
        schema:
          type: boolean
          description: Só pedidos com número de hub/conector. A partir da versão 1.0.84.229.
      - name: hasOrderIdMktplace
        in: query
        required: false
        schema:
          type: boolean
          description: Só pedidos com número de marketplace. A partir da versão 1.0.84.229.
      - name: integrationOrigin
        in: query
        required: false
        schema:
          type: string
          description: 'Filtra pela coluna ORIGEMINTEGRACAO (ex.: pedidos vindos do PDVSYNC). A partir da versão 1.3.0.40.'
      - name: ignoreExcludedCustomers
        in: query
        required: false
        schema:
          type: boolean
          description: Ignora o filtro de clientes excluídos na busca.
      - name: viewDocument
        in: query
        required: false
        schema:
          type: boolean
          default: false
          description: Quando true, inclui o grupo document com número, série, chave, valor e data de autorização da NF de saída, mais as notas
            de devolução do cliente e itens devolvidos. A partir da versão 1.39.5.17 do winthor-pedido-venda. NF cancelada não aparece; pedido
            não faturado traz valores padrão (1900-01-01); NF pendente na SEFAZ aparece como 'Em processamento da SEFAZ'.
      - name: supplierCode
        in: query
        required: false
        schema:
          type: integer
          description: Filtra pedidos que tenham ao menos um item do fornecedor informado. A partir da versão 1.39.5.17.
      - name: onlyProductsSupplierCode
        in: query
        required: false
        schema:
          type: boolean
          description: Com supplierCode, devolve só os itens (e devoluções) desse fornecedor. Sem supplierCode a API responde 400.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                first: true
                hasNext: false
                items:
                - orderId: '1234567'
                  createData: '2026-08-03T10:15:00'
                  lastChange: '2026-08-04T08:02:11'
                  branchId: '1'
                  orderStatus: L
                  saleOrigin: F
                  saleType: 1
                  paymentPlanId: 12
                  chargingId: BK
                  totalValue: '1520.40'
                  customer:
                    id: 3021
                    tradeName: MERCADO EXEMPLO
                    email: compras@example.com
                    corporate: true
                    sellerId: 15
                  listOfOrderItem:
                  - productId: 1001
                    productSKUERPReferenceKey: 7890000000017-1001
                    quantity: 12.0
                    sellPrice: 126.7
                    tablePrice: 130.0
                    discountPercentage: 2.5
                    realCost: 98.1
                    warehouseBranchId: '1'
                    position: 1
                  document:
                    documentNumber: 456789
                    series: '1'
                    keyDocument: <<CHAVE_NFE_44_DIGITOS>>
                    totalValue: 1520.4
                    sefazAuthorizationDate: '2026-08-04T08:01:55'
                    documentType: NF-e
                    listOfReturnDocuments: []
        '400':
          description: Bad Request — onlyProductsSupplierCode=true sem supplierCode.
        '403':
          description: '{"code": "UNK-ERR", "message": "Erro de Requisição", "detailedMessage": "The current Subject is not authenticated. Access
            denied.", "details": []} — Chamada sem sessão válida: login não feito, cookie/token não reenviado ou token vencido (vale 4 horas).'
        '404':
          description: 'HTML do Jetty: "HTTP ERROR 404 Problem accessing <caminho>. Reason: Not Found" — Serviço do WTA que atende a rota não
            está instalado ou ativo, ou a porta informada não é a do WTA.'
  /api/wholesale/v1/orders/:
    get:
      operationId: totvs-winthor__pedido__obter
      summary: Consultar Pedido (winthor-pedido-venda)
      description: 'Devolve um pedido de venda pelo número, com cabeçalho, cliente, itens, cobranças múltiplas e, com viewDocument=true, os dados
        da NF de saída e das devoluções. Quando usar: Para conferir um pedido específico (posição, itens, NF). Quando não usar: para vários pedidos
        ou um período use pedido.listar.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=632099891
      x-servico-wta: winthor-pedido-venda
      x-seguro-para-executar: true
      parameters:
      - name: orderId
        in: query
        required: true
        schema:
          type: integer
          description: Número do pedido no WinThor (PCPEDC.NUMPED).
      - name: viewDocument
        in: query
        required: false
        schema:
          type: boolean
          default: false
          description: Quando true, inclui o grupo document com número, série, chave, valor e data de autorização da NF de saída, mais as notas
            de devolução do cliente e itens devolvidos. A partir da versão 1.39.5.17 do winthor-pedido-venda. NF cancelada não aparece; pedido
            não faturado traz valores padrão (1900-01-01); NF pendente na SEFAZ aparece como 'Em processamento da SEFAZ'.
      - name: supplierCode
        in: query
        required: false
        schema:
          type: integer
          description: Filtra pedidos que tenham ao menos um item do fornecedor informado. A partir da versão 1.39.5.17.
      - name: onlyProductsSupplierCode
        in: query
        required: false
        schema:
          type: boolean
          description: Com supplierCode, devolve só os itens (e devoluções) desse fornecedor. Sem supplierCode a API responde 400.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                orderId: '1234567'
                createData: '2026-08-03T10:15:00'
                lastChange: '2026-08-04T08:02:11'
                branchId: '1'
                orderStatus: L
                saleOrigin: W
                totalValue: '1520.40'
                customer:
                  id: 3021
                listOfOrderItem:
                - productId: 1001
                  quantity: 12.0
                  sellPrice: 126.7
                document:
                  documentNumber: 456789
                  series: '1'
                  documentType: NF-e
        '403':
          description: '{"code": "UNK-ERR", "message": "Erro de Requisição", "detailedMessage": "The current Subject is not authenticated. Access
            denied.", "details": []} — Chamada sem sessão válida: login não feito, cookie/token não reenviado ou token vencido (vale 4 horas).'
        '404':
          description: 'HTML do Jetty: "HTTP ERROR 404 Problem accessing <caminho>. Reason: Not Found" — Serviço do WTA que atende a rota não
            está instalado ou ativo, ou a porta informada não é a do WTA.'
    post:
      operationId: totvs-winthor__pedido__criar
      summary: Gravar pedido (winthor-pedido-venda)
      description: 'Inclui um pedido de venda no WinThor (PCPEDC/PCPEDI) com cliente, filial, plano de pagamento, cobrança, itens (SKU codauxiliar-codprod,
        quantidade, preço, filial de retirada), frete, dados de intermediador e, opcionalmente, múltiplas cobranças e dados do consumidor. Quando
        usar: Para integrar pedidos de e-commerce, marketplace ou B2B no ERP. Quando não usar: o assistente não executa; para consultar pedidos
        use pedido.listar.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=632099891
      x-servico-wta: winthor-pedido-venda
      x-seguro-para-executar: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                createData:
                  type: string
                  format: date-time
                  description: Data de criação do pedido.
                customer:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Código do cliente (PCPEDC.CODCLI).
                branchId:
                  type: string
                  description: Filial do pedido.
                paymentPlanId:
                  type: integer
                  description: Plano de pagamento.
                saleType:
                  type: integer
                  enum:
                  - 1
                  - 5
                  - 7
                  - 8
                  description: 1 venda normal (5, 7 e 8 marcados para uso futuro).
                saleOrigin:
                  type: string
                  enum:
                  - B
                  - R
                  - K
                  - C
                  - F
                  - T
                  - W
                  - A
                  description: Origem do pedido.
                chargingId:
                  type: string
                  description: Cobrança; sem ela grava BK.
                orderIdHube:
                  type: string
                  description: Número do pedido no hub/conector (com orderIdMktplace, chave de duplicidade).
                orderIdMktplace:
                  type: string
                  description: Número do pedido no marketplace.
                seller:
                  type: integer
                  description: RCA; sem ele usa o parâmetro 4012 da rotina 132.
                valueFreight:
                  type: number
                  description: Valor do frete.
                otherExpenses:
                  type: number
                  description: Outras despesas.
                permissions:
                  type: object
                  properties:
                    acceptOrderWithoutTax:
                      type: boolean
                      description: false rejeita item sem figura tributária.
                listOfOrderItem:
                  type: array
                  items: &id001 {}
                  description: 'Itens: productSKUERPReferenceKey (codauxiliar-codprod), quantity, sellPrice, discountValue, warehouseBranchId,
                    gift, taxFigureId, deliveryType.'
                listPayment:
                  type: array
                  items: *id001
                  description: Múltiplas cobranças (exige parâmetro 3968 da rotina 132).
                listConsumerData:
                  type: array
                  items: *id001
                  description: Dados do consumidor gravados na PCVENDACONSUM.
              required:
              - createData
              - customer
              - branchId
              - paymentPlanId
              - saleType
              - saleOrigin
              - listOfOrderItem
            example:
              createData: '2026-08-03T10:15:00'
              customer:
                id: 3021
              branchId: '1'
              paymentPlanId: 12
              saleType: 1
              saleOrigin: W
              orderIdHube: HUB-0001
              orderIdMktplace: MKT-0001
              permissions:
                acceptOrderWithoutTax: false
              listOfOrderItem:
              - productSKUERPReferenceKey: 7890000000017-1001
                quantity: 2
                sellPrice: 27.9
                warehouseBranchId: '1'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                orderId: '1234568'
                orderStatus: L
        '403':
          description: '{"code": "UNK-ERR", "message": "Erro de Requisição", "detailedMessage": "The current Subject is not authenticated. Access
            denied.", "details": []} — Chamada sem sessão válida: login não feito, cookie/token não reenviado ou token vencido (vale 4 horas).'
    delete:
      operationId: totvs-winthor__pedido__cancelar
      summary: CancelarPedido / CancelarItemPedido
      description: 'Cancela um pedido inteiro ou, informando produto e sequência, só um item, com motivo e opção de avisar o RCA. Quando usar:
        Para refletir no ERP um cancelamento feito no canal de venda. Quando não usar: o assistente não executa cancelamentos.'
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=632099891
      x-servico-wta: winthor-pedido-venda
      x-seguro-para-executar: false
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
          description: Número do pedido.
      - name: reasonCancellation
        in: query
        required: true
        schema:
          type: string
          description: Motivo do cancelamento.
      - name: sendMessageRca
        in: query
        required: false
        schema:
          type: boolean
          description: Enviar mensagem ao RCA.
      - name: productCode
        in: query
        required: false
        schema:
          type: integer
          description: Código do produto, para cancelar só um item.
      - name: sequence
        in: query
        required: false
        schema:
          type: integer
          description: Sequência do item no pedido, para cancelar só um item.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example: {}
        '403':
          description: '{"code": "UNK-ERR", "message": "Erro de Requisição", "detailedMessage": "The current Subject is not authenticated. Access
            denied.", "details": []} — Chamada sem sessão válida: login não feito, cookie/token não reenviado ou token vencido (vale 4 horas).'
  /api/wholesale/v1/customer/list:
    get:
      operationId: totvs-winthor__cliente__listar
      summary: Listar cadastro de clientes (winthor-pedido-venda)
      description: 'Lista o cadastro de clientes (rotina 302) com dados fiscais, endereços comercial, de cobrança e de entrega, contato, RCA,
        praça, plano de pagamento, rede, situação (ativo, bloqueado) e, opcionalmente, endereços de entrega adicionais. Quando usar: Para base
        de clientes, cruzamento com pedidos e análise por cidade, RCA ou rede. Use lastChange para carga incremental. Quando não usar: para um
        cliente só use cliente.obter; para só contar use cliente.listar.contagem.'
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://tdn.totvs.com/pages/releaseview.action?pageId=632097966
      x-servico-wta: winthor-pedido-venda
      x-seguro-para-executar: true
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
          description: Página.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          description: Registros por página.
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: CODCLI
          description: Campo(s) de ordenação, com ASC/DESC e vários separados por vírgula. Campo inválido devolve 400.
      - name: lastChange
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: Clientes alterados a partir desta data/hora. A TDN mostra o exemplo 1900-01-01T12:00:00 e descreve o formato como 'yyyy-MM-dd
            HH:mm:ss'; teste qual a instalação aceita.
      - name: personIdentificationNumber
        in: query
        required: false
        schema:
          type: string
          description: 'CPF ou CNPJ do cliente. Disponível a partir da versão 1.3.0.1. Sem resultado: 404.'
      - name: finalCostumer
        in: query
        required: false
        schema:
          type: string
          enum:
          - S
          - N
          description: 'S só consumidor final, N só não consumidor final. Grafia do fornecedor: finalCostumer (com ''Costumer'').'
      - name: personalType
        in: query
        required: false
        schema:
          type: string
          enum:
          - J
          - F
          description: J só pessoa jurídica, F só pessoa física.
      - name: branchId
        in: query
        required: false
        schema:
          type: string
          description: Filial ou filiais do cliente, separadas por vírgula.
      - name: ignoreClientPDVOmni
        in: query
        required: false
        schema:
          type: boolean
          default: false
          description: Ignora clientes inseridos pelo PDV Omni.
      - name: withDeliveryAddress
        in: query
        required: false
        schema:
          type: boolean
          default: false
          description: Inclui a lista deliveryAddresses de cada cliente. A partir da versão 1.2.0.1122 do winthor-pedido-venda.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                first: true
                hasNext: false
                items:
                - id: 3021
                  name: MERCADO EXEMPLO LTDA
                  tradeName: MERCADO EXEMPLO
                  personIdentificationNumber: 00000000000191
                  stateInscription: ISENTO
                  corporate: true
                  businessCity: GOIANIA
                  commercialZipCode: '74000000'
                  email: compras@example.com
                  corporatePhone: '6200000000'
                  sellerId: 15
                  paymentPlanId: 12
                  active: true
                  isBlocked: false
                  lastChange: '2026-08-02T14:20:00'
        '400':
          description: Valor informado no parâmetro 'order' não encontrado ou inválido. — Campo de ordenação inexistente.
        '404':
