openapi: 3.1.0
info:
  title: Qive (antiga Arquivei) — API de documentos fiscais (recorte do catálogo)
  version: 1.105.0 (Swagger oficial consultado em 2026-10-14)
  summary: Reconstrução das leituras de NF-e, CT-e, CT-e OS, NFS-e, NFC-e, MDF-e, eventos, PDFs, boletos e comprovantes, mais webhooks e escritas
    de referência.
  description: Reconstruído do Swagger 2.0 oficial https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json (título 'Qive API', versão
    1.105.0), que alimenta o Portal do Desenvolvedor https://developers.qive.com.br. Descrições autorais; caminhos, parâmetros e campos exatos.
    Operações não detalhadas estão em endpoints.json > endpoints_secundarios.
  contact:
    name: Suporte Qive
    url: https://developers.qive.com.br/help
  x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
  x-data-consulta: '2026-10-14'
externalDocs:
  description: Portal do Desenvolvedor Qive
  url: https://developers.qive.com.br
servers:
- url: https://api.arquivei.com.br
  description: Produção (host único; a marca mudou para Qive, o host continua arquivei.com.br)
- url: https://sandbox-api.arquivei.com.br
  description: Sandbox (credenciais de teste geradas em https://developers.qive.com.br/sandbox; notas sintéticas)
security:
- XApiId: []
  XApiKey: []
components:
  securitySchemes:
    XApiId:
      type: apiKey
      in: header
      name: X-API-ID
      description: Identificador da credencial emitida pela Qive.
    XApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Chave secreta da credencial.
    XApiPermissionKey:
      type: apiKey
      in: header
      name: X-API-PERMISSION-KEY
      description: Chave de permissão para parceiros (declarada no Swagger; uso não detalhado na documentação).
paths:
  /v2/dfe/nfe:
    post:
      operationId: arquivei__nota_fiscal__listar__nfe
      summary: Busca de NFes (API 2.0) — Lista as NFes da conta com base nos filtros aplicados
      description: 'Busca as NF-e da conta (recebidas, emitidas, como transportadora ou autorizada no autXML) com filtros no corpo JSON e projeção
        de campos: o integrador escolhe em Fields o que quer receber (chave, número, datas, emitente, destinatário, status, CFOPs, manifestações,
        eventos, tags e, se pedir, o XML em Base64 ou o documento em JSON). É a rota recomendada pela Qive para buscas desde a API 2.0. Apesar
        do POST, é uma consulta: não grava nada. Para a planilha de NF-e do período: recebidas (OwnerRoles=received) ou emitidas (emitted), por
        data de emissão, status (authorized/canceled), CNPJ do emitente ou destinatário, CFOP, finalidade ou tags. Quando NÃO usar: para o PDF
        (use arquivei.nota_fiscal.baixar_arquivo.danfe) ou para os XMLs de evento de uma chave (arquivei.nota_fiscal.obter.eventos_nfe). Valor
        total e série não vêm como campo próprio: estão no XML (peça ''Xml'' em Fields e leia total/ICMSTot/vNF).'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: true
      parameters:
      - name: X-Use-ApiGateway
        in: header
        required: true
        schema:
          type: string
          enum: &id001
          - always
          default: always
          description: 'Cabeçalho exigido pela documentação para rotear a chamada pelo API Gateway da Qive; o valor é sempre ''always''. Não é
            credencial: é fixo. Sem ele a rota pode não ser atendida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Filters:
                  type: object
                  properties:
                    EmissionDate:
                      type: object
                      properties:
                        From:
                          type: string
                          description: 'Início do período de emissão. Formato: AAAA-MM-DD ou AAAA-MM-DD HH:MM:SS. Sem EmissionDate a API aplica
                            os últimos 30 dias. A ajuda oficial usa AAAA-MM-DD HH:MM:SS.'
                        To:
                          type: string
                          description: 'Fim do período de emissão. Formato: AAAA-MM-DD HH:MM:SS.'
                    CreatedAt:
                      type: object
                      properties:
                        From:
                          type: string
                          description: 'Início do período de entrada do documento na Qive (captura/importação), não de emissão. Formato: AAAA-MM-DD
                            HH:MM:SS.'
                        To:
                          type: string
                          description: 'Fim do período de entrada na Qive. Formato: AAAA-MM-DD HH:MM:SS.'
                    OwnerRoles:
                      type: array
                      items:
                        type: string
                        enum:
                        - received
                        - emitted
                        - transporter
                        - authorized
                      description: Papel do CNPJ da conta na nota. A descrição e a ajuda usam received/emitted/transporter/authorized; o exemplo
                        do schema mostra receiver/emitter. Use os valores da descrição e valide no sandbox.
                    Owners:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs donos dos documentos na Qive (os CNPJs da conta).
                    Status:
                      type: string
                      enum:
                      - authorized
                      - canceled
                      description: Situação do documento.
                    DocumentIdentifier:
                      type: string
                      description: 'Chave de acesso para busca exata. Formato: 44 dígitos.'
                    EmitterCnpj:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs dos emitentes.
                    ReceiverCnpj:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs dos destinatários.
                    TransporterCnpj:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs dos transportadores.
                    Cfops:
                      type: array
                      items:
                        type: string
                      description: CFOPs.
                    FinNFe:
                      type: array
                      items:
                        type: string
                        enum:
                        - '1'
                        - '2'
                        - '3'
                        - '4'
                        - '5'
                        - '6'
                      description: Finalidade (campo finNFe do XML). 1 normal, 2 complementar, 3 ajuste, 4 devolução, 5 crédito, 6 débito.
                    NfeNumber:
                      type: object
                      properties:
                        From:
                          type: integer
                          description: Número inicial da faixa.
                        To:
                          type: integer
                          description: Número final da faixa.
                    HasCCE:
                      type: boolean
                      description: Só notas com (true) ou sem (false) carta de correção.
                    HasEvent:
                      type: boolean
                      description: Só notas com eventos associados.
                    HasManifestation:
                      type: boolean
                      description: Só notas com manifestação do destinatário.
                    Origins:
                      type: array
                      items:
                        type: string
                        enum:
                        - sefaz
                        - upload
                        - upload_zip
                        - upload_daemon
                        - upload_api
                        - email
                        - integracoes
                      description: Origem do documento na Qive. O schema chama o campo Origins; a descrição do corpo, Origin.
                    Tags:
                      type: array
                      items:
                        type: string
                      description: IDs de etiquetas (pelo menos uma).
                    TagsAll:
                      type: array
                      items:
                        type: string
                      description: IDs de etiquetas (todas).
                    XPeds:
                      type: array
                      items:
                        type: string
                      description: Números de pedido (xPed) citados na nota.
                    CustomData:
                      type: array
                      items:
                        type: string
                      description: 'Filtro por properties: lista de {Name, Values}; E entre itens, OU entre valores.'
                Fields:
                  type: array
                  items:
                    type: string
                    enum:
                    - Xml
                    - Origin
                    - FlagErp
                    - CustomData
                    - Document
                    - Events
                    - Tags
                    - Cfops
                    - AccessKey
                    - EmissionDate
                    - CreatedAt
                    - HasCCE
                    - Manifestations
                    - Number
                    - Owner
                    - OwnerRole
                    - Receiver
                    - Emitter
                    - Status
                  description: Campos a devolver. Sem Fields vêm só Xml e AccessKey.
                Limit:
                  type: integer
                  default: 500
                  maximum: 500
                  description: Tamanho da página. Padrão e máximo 500; a ajuda oficial recomenda até 100 por bloco.
                Paginator:
                  type: string
                  description: Cursor devolvido em Paginator na página anterior; vazio na primeira chamada.
            example:
              Filters:
                EmissionDate:
                  From: '2026-09-01 00:00:00'
                  To: '2026-09-30 23:59:59'
                OwnerRoles:
                - received
                Status: authorized
              Fields:
              - AccessKey
              - Number
              - EmissionDate
              - CreatedAt
              - Status
              - Owner
              - OwnerRole
              - Emitter
              - Receiver
              - Cfops
              - HasCCE
              - Manifestations
              - Origin
              - FlagErp
              - Xml
              Limit: 100
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              example:
                Nfes:
                - AccessKey: '35260900000000000191550010000012341000012345'
                  Number: '1234'
                  EmissionDate: '2026-09-15 10:22:31'
                  CreatedAt: '2026-09-15 10:40:02'
                  Status: authorized
                  Owner: 00000000000191
                  OwnerRole: received
                  Origin: sefaz
                  FlagErp: false
                  HasCCE: false
                  Cfops:
                  - '5102'
                  Emitter:
                    EmitterCnpj: 00000000000191
                    EmitterName: FORNECEDOR EXEMPLO LTDA
                    EmitterAddressUf: SP
                  Receiver:
                    ReceiverCnpj: 00000000000191
                    ReceiverName: EMPRESA EXEMPLO SA
                    ReceiverAddressUf: SP
                  Manifestations: []
                  Xml: PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4...
                Paginator: '["<<cursor-opaco>>"]'
                Total: 1
        '400':
          description: Corpo JSON malformado, filtro com tipo errado ou valor não aceito.
        '401':
          description: X-API-ID ou X-API-KEY ausente, errado, revogado ou de outro ambiente (credencial de sandbox chamando produção, ou o contrário).
        '429':
          description: Limite de requisições da conta atingido. A Qive define o limite por cliente, conforme contrato e volume.
        '500':
          description: Falha interna da Qive.
  /v1/dfe/cte:
    post:
      operationId: arquivei__nota_fiscal__listar__cte
      summary: Busca de CTes — Lista os CTes da conta com base nos filtros aplicados
      description: 'Busca os CT-e da conta com filtros no corpo JSON e projeção de campos: chave, número, datas, status, emitente, tomador, remetente,
        destinatário, expedidor, CFOPs, NF-e relacionadas, eventos, manifestações, grupo IBS/CBS da reforma e, se pedido, o XML em Base64. Consulta,
        sem efeito colateral. Para a planilha de fretes (CT-e) do período, em especial os tomados pela empresa (IsTaker=true), por emissão, status,
        emitente ou NF-e transportada. Quando NÃO usar: para CT-e OS (use arquivei.nota_fiscal.listar.cteos) ou para o PDF (arquivei.nota_fiscal.baixar_arquivo.dacte).
        O valor da prestação está no XML (vPrest/vTPrest).'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: true
      parameters:
      - name: X-Use-ApiGateway
        in: header
        required: true
        schema:
          type: string
          enum: *id001
          default: always
          description: 'Cabeçalho exigido pela documentação para rotear a chamada pelo API Gateway da Qive; o valor é sempre ''always''. Não é
            credencial: é fixo. Sem ele a rota pode não ser atendida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Filters:
                  type: object
                  properties:
                    EmissionDate:
                      type: object
                      properties:
                        From:
                          type: string
                          description: 'Início do período de emissão. Formato: AAAA-MM-DD HH:MM:SS.'
                        To:
                          type: string
                          description: 'Fim do período de emissão. Formato: AAAA-MM-DD HH:MM:SS.'
                    CreatedAt:
                      type: object
                      properties:
                        From:
                          type: string
                          description: 'Início do período de entrada na Qive. Formato: AAAA-MM-DD HH:MM:SS.'
                        To:
                          type: string
                          description: 'Fim do período de entrada na Qive. Formato: AAAA-MM-DD HH:MM:SS.'
                    IsTaker:
                      type: boolean
                      description: true = só CT-e em que o CNPJ da conta é o tomador.
                    Owners:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs donos dos documentos na Qive.
                    EmitterCnpj:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs dos emitentes (transportadoras).
                    Status:
                      type: string
                      enum:
                      - authorized
                      - canceled
                      description: Situação.
                    DocumentIdentifier:
                      type: string
                      description: 'Chave de acesso do CT-e. Formato: 44 dígitos.'
                    Nfes:
                      type: array
                      items:
                        type: string
                      description: Chaves de NF-e relacionadas ao CT-e.
                    Types:
                      type: array
                      items:
                        type: string
                      description: 'Tipos de CT-e (ex.: normal, complemento).'
                    Cfops:
                      type: array
                      items:
                        type: string
                      description: CFOPs.
                    Origin:
                      type: array
                      items:
                        type: string
                      description: 'Origem (ex.: sefaz, upload).'
                    HasCCE:
                      type: boolean
                      description: Com carta de correção.
                    HasManifestation:
                      type: boolean
                      description: Com manifestação.
                    Tags:
                      type: array
                      items:
                        type: string
                      description: IDs de etiquetas (pelo menos uma).
                    CustomData:
                      type: array
                      items:
                        type: string
                      description: Filtro por properties {Name, Values}.
                fields:
                  type: array
                  items:
                    type: string
                    enum:
                    - Xml
                    - Origin
                    - FlagErp
                    - CustomData
                    - Document
                    - Events
                    - Tags
                    - Cfops
                    - AccessKey
                    - EmissionDate
                    - CreatedAt
                    - HasCCE
                    - Manifestations
                    - Number
                    - Owner
                    - OwnerRole
                    - Addressee
                    - Dispatcher
                    - Sender
                    - Receiver
                    - Emitter
                    - Status
                    - Taker
                    - IBSCBS
                    - AccessKeyPrev
                    - AccessKeysComp
                  description: Campos a devolver. O schema grafa 'fields' (minúsculo) e a descrição 'Fields'; a doc não diz o padrão quando ausente.
                Limit:
                  type: integer
                  default: 500
                  maximum: 500
                  description: Tamanho da página.
                Paginator:
                  type: string
                  description: Cursor da página anterior.
            example:
              Filters:
                EmissionDate:
                  From: '2026-09-01 00:00:00'
                  To: '2026-09-30 23:59:59'
                IsTaker: true
              fields:
              - AccessKey
              - Number
              - EmissionDate
              - Status
              - Emitter
              - Taker
              - Sender
              - Receiver
              - Cfops
              - Xml
              Limit: 100
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              example:
                Ctes:
                - AccessKey: '35260900000000000191570010000003211000003214'
                  Number: '321'
                  EmissionDate: '2026-09-10 08:00:00'
                  Status: authorized
                  Emitter:
                    EmitterCpfCnpj: 00000000000191
                    EmitterName: TRANSPORTADORA EXEMPLO LTDA
                    EmitterAddressUf: SP
                  Taker:
                    TakerCpfCnpj: 00000000000191
                    TakerName: EMPRESA EXEMPLO SA
                  Cfops:
                  - '6353'
                  Xml: PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4...
                Paginator: '["<<cursor-opaco>>"]'
                Total: 1
        '400':
          description: Corpo JSON malformado, filtro com tipo errado ou valor não aceito.
        '401':
          description: X-API-ID ou X-API-KEY ausente, errado, revogado ou de outro ambiente (credencial de sandbox chamando produção, ou o contrário).
        '429':
          description: Limite de requisições da conta atingido. A Qive define o limite por cliente, conforme contrato e volume.
        '500':
          description: Falha interna da Qive.
  /v1/dfe/nfse:
    post:
      operationId: arquivei__nota_fiscal__listar__nfse
      summary: Busca de NFSes — Lista as NFses da conta com base nos filtros aplicados
      description: 'Busca as NFS-e da conta (prestadas e tomadas, de prefeituras e do padrão nacional) com filtros no corpo: emissão, criação
        na Qive, competência (AAAA-MM), emitente, tomador, papel do dono, origem e cancelamento. Devolve emitente, tomador, status, id da nota
        e, conforme fields, o XML no padrão ABRASF da Qive, o ABRASF com campos da reforma tributária ou o XML original. Para a planilha de notas
        de serviço tomadas (ownerRoles=taker) ou prestadas (emitter) num período ou competência. Quando NÃO usar: para o PDF (arquivei.nota_fiscal.baixar_arquivo.danfse).
        O id da NFS-e (formato dono:emissor:data:número) é o que as rotas de PDF e eventos pedem.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: true
      parameters:
      - name: X-Use-ApiGateway
        in: header
        required: true
        schema:
          type: string
          enum: *id001
          default: always
          description: 'Cabeçalho exigido pela documentação para rotear a chamada pelo API Gateway da Qive; o valor é sempre ''always''. Não é
            credencial: é fixo. Sem ele a rota pode não ser atendida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    emissionDate:
                      type: object
                      properties:
                        from:
                          type: string
                          description: 'Início do período de emissão. Formato: AAAA-MM-DD HH:MM:SS. A descrição grafa from/to (minúsculo); o objeto
                            TimeRange do schema usa From/To.'
                        to:
                          type: string
                          description: 'Fim do período de emissão. Formato: AAAA-MM-DD HH:MM:SS.'
                    createdAt:
                      type: object
                      properties:
                        from:
                          type: string
                          description: 'Início do período de entrada na Qive. Formato: AAAA-MM-DD HH:MM:SS.'
                        to:
                          type: string
                          description: 'Fim do período de entrada na Qive. Formato: AAAA-MM-DD HH:MM:SS.'
                    competence:
                      type: array
                      items:
                        type: string
                      description: 'Competências no formato AAAA-MM. Formato: AAAA-MM.'
                    ownerRoles:
                      type: array
                      items:
                        type: string
                        enum:
                        - emitter
                        - taker
                        - intermediate
                      description: Papel do dono na nota.
                    owners:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs donos.
                    emitterCnpj:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs dos prestadores.
                    takerCnpj:
                      type: array
                      items:
                        type: string
                      description: CNPJs/CPFs dos tomadores.
                    isCanceled:
                      type: string
                      enum:
                      - 'true'
                      - 'false'
                      description: '''true'' só canceladas; ''false'' só não canceladas.'
                    origin:
                      type: string
                      description: 'Origem (ex.: nacional, upload, ginfes).'
                    documentIdentifier:
                      type: string
                      description: 'Id da NFS-e: cnpjOuCpfDono:cnpjEmissor:AAAA-MM-DD:numero.'
                    customData:
                      type: array
                      items:
                        type: string
                      description: Filtro por properties {Name, Values}.
                fields:
                  type: array
                  items:
                    type: string
                    enum:
                    - xmlAbrasf
                    - xmlAbrasfRtc
                    - originalXml
                    - origin
                    - flagErp
                    - customData
                    - document
                  description: Campos a devolver.
                paginator:
                  type: string
                  description: Cursor da página anterior.
            example:
              filters:
                emissionDate:
                  from: '2026-09-01 00:00:00'
                  to: '2026-09-30 23:59:59'
                ownerRoles:
                - taker
              fields:
              - origin
              - flagErp
              - xmlAbrasf
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              example:
                nfses:
                - id: 00000000000191:00000000000191:2026-09-12:1
                  status: authorized
                  origin: nacional
                  emitter:
                    emitterCpfCnpj: 00000000000191
                    emitterName: PRESTADOR EXEMPLO LTDA
                    emitterAddressCity: Campinas
                  taker:
                    takerCpfCnpj: 00000000000191
                    takerName: EMPRESA EXEMPLO SA
                  xmlAbrasf: PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4...
                paginator: <<cursor-opaco>>
                total: 1
        '400':
          description: Corpo JSON malformado, filtro com tipo errado ou valor não aceito.
        '401':
          description: X-API-ID ou X-API-KEY ausente, errado, revogado ou de outro ambiente (credencial de sandbox chamando produção, ou o contrário).
        '429':
          description: Limite de requisições da conta atingido. A Qive define o limite por cliente, conforme contrato e volume.
        '500':
          description: Falha interna da Qive.
  /v1/dfe/cteos:
    post:
      operationId: arquivei__nota_fiscal__listar__cteos
      summary: Busca de CTe-OS — Lista os CTe-OS da conta com base nos filtros aplicados
      description: 'Busca os CT-e OS (outros serviços: transporte de pessoas, valores, bagagem) da conta com filtros no corpo e projeção de campos.
        Não filtra por papel: devolve os documentos de todos os papéis dos CNPJs informados em Owners. Sem Fields vêm AccessKey e Xml. Para a
        relação de CT-e OS do período (fretamento, transporte de valores). Quando NÃO usar: para CT-e comum (arquivei.nota_fiscal.listar.cte).'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: true
      parameters:
      - name: X-Use-ApiGateway
        in: header
        required: true
        schema:
          type: string
          enum: *id001
          default: always
          description: 'Cabeçalho exigido pela documentação para rotear a chamada pelo API Gateway da Qive; o valor é sempre ''always''. Não é
            credencial: é fixo. Sem ele a rota pode não ser atendida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Filters:
                  type: object
                  properties:
                    EmissionDate:
                      type: object
                      properties:
                        From:
                          type: string
                          description: 'Início do período de emissão. Formato: AAAA-MM-DD HH:MM:SS.'
                        To:
                          type: string
                          description: 'Fim do período de emissão. Formato: AAAA-MM-DD HH:MM:SS.'
                    CreatedAt:
                      type: object
                      properties:
                        From:
                          type: string
                          description: Início do período de entrada na Qive.
                        To:
                          type: string
