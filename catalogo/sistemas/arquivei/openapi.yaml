  /v1/nfse/event:
    post:
      operationId: arquivei__nota_fiscal__manifestar__nfse
      summary: Evento de NFSe — Registra evento de manifestação do tomador em uma NFS-e
      description: 'Registra, em nome do tomador, a confirmação (ConfirmacaoTomador, evento 203202) ou a rejeição (RejeicaoTomador, 203206, com
        justificativa de 15 a 255 caracteres) de uma NFS-e do padrão nacional na Sefin Nacional. Síncrono: HTTP 200 só indica que a Sefin respondeu;
        o registro é confirmado por data.n_dfse e a rejeição vem em data.erros. Quando o tomador quer confirmar ou rejeitar uma NFS-e nacional
        pela integração. ESCRITA com efeito fiscal: o assistente não executa.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: false
      parameters:
      - name: X-Use-ApiGateway
        in: header
        required: true
        schema:
          type: string
          enum: *id001
          default: always
          description: 'Cabeçalho exigido pela documentação para rotear a chamada pelo API Gateway da Qive; o valor é sempre ''always''. Não é
            credencial: é fixo. Sem ele a rota pode não ser atendida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  type: string
                  description: CNPJ do tomador (precisa pertencer à conta).
                access_key:
                  type: string
                  description: 'Chave da NFS-e nacional (50 posições, dígitos ou letras maiúsculas). Formato: 50 posições.'
                tp_evento:
                  type: string
                  enum:
                  - ConfirmacaoTomador
                  - RejeicaoTomador
                  description: Tipo do evento.
                x_justificativa:
                  type: string
                  description: Obrigatória para RejeicaoTomador, 15 a 255 caracteres.
                n_seq_evento:
                  type: integer
                  default: 1
                  description: Sequencial do evento (padrão 1).
              required:
              - owner
              - access_key
              - tp_evento
            example:
              owner: 00000000000191
              access_key: <<chave NFS-e nacional de 50 posições>>
              tp_evento: ConfirmacaoTomador
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              example:
                status:
                  code: 200
                  message: OK
                data:
                  tipo_ambiente: '2'
                  n_dfse: <<número>>
                  erros: null
        '400':
          description: Corpo malformado, chave fora do formato (chave de NF-e de 44 é recusada) ou justificativa fora dos limites.
        '403':
          description: owner não pertence à conta.
        '401':
          description: X-API-ID ou X-API-KEY ausente, errado, revogado ou de outro ambiente (credencial de sandbox chamando produção, ou o contrário).
        '500':
          description: Falha interna da Qive.
