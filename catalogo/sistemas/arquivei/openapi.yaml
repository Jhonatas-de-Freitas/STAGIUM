  /v1/receipts/list:
    post:
      operationId: arquivei__pagamento__listar__comprovantes
      summary: Busca de Comprovantes — Lista os comprovantes de pagamento da conta
      description: 'Lista os comprovantes de pagamento da conta (enviados pelo cliente ou capturados pela conexão bancária) com projeção de campos:
        data e valor pagos, código de autenticação, linha digitável do boleto pago, vencimento, pagador e recebedor. Filtra por data de pagamento,
        documento do recebedor, faixa de valor e identificador. Ordenado por data de pagamento decrescente. O mesmo endpoint entrega o PDF se
        ''EncodedPdf'' for pedido em Fields (com até 2 identificadores por chamada em produção). Para a planilha de pagamentos realizados (conciliação
        de contas a pagar). Quando NÃO usar: para boletos em aberto (arquivei.conta_pagar.listar.boletos). Não peça EncodedPdf na listagem.'
      tags:
      - Pagamento
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: true
      parameters:
      - name: X-Use-ApiGateway
        in: header
        required: true
        schema:
          type: string
          enum: *id001
          default: always
          description: 'Cabeçalho exigido pela documentação para rotear a chamada pelo API Gateway da Qive; o valor é sempre ''always''. Não é
            credencial: é fixo. Sem ele a rota pode não ser atendida.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Filters:
                  type: object
                  properties:
                    PaymentDate:
                      type: object
                      properties:
                        From:
                          type: string
                          format: date
                          description: 'Pagamento a partir de (inclusivo). Formato: AAAA-MM-DD.'
                        To:
                          type: string
                          format: date
                          description: 'Pagamento até (inclusivo). Formato: AAAA-MM-DD.'
                    ReceiverDocument:
                      type: array
                      items:
                        type: string
                      description: CPF/CNPJ do recebedor (validado por dígito; inválido dá 400).
                    Amount:
                      type: object
                      properties:
                        From:
                          type: number
                          description: Valor mínimo (inclusivo).
                        To:
                          type: number
                          description: Valor máximo (inclusivo).
                    Identifier:
                      type: array
                      items:
                        type: string
                      description: Identificadores opacos de comprovantes; obrigatório com EncodedPdf.
                Fields:
                  type: array
                  items:
                    type: string
                    enum:
                    - Identifier
                    - Source
                    - PaymentDate
                    - Amount
                    - CurrencyCode
                    - CodeAuth
                    - BankSlipNumber
                    - DueDate
                    - Payer
                    - Receiver
                    - EncodedPdf
                  description: Campos a devolver (caixa exata).
                Limit:
                  type: integer
                  default: 50
                  maximum: 500
                  description: Tamanho da página. Acima de 500 é limitado, não rejeitado.
                Paginator:
                  type: string
                  description: Cursor opaco da página anterior; vazio = primeira página.
            example:
              Filters:
                PaymentDate:
                  From: '2026-09-01'
                  To: '2026-09-30'
              Fields:
              - Identifier
              - Source
              - PaymentDate
              - Amount
              - DueDate
              - BankSlipNumber
              - CodeAuth
              - Payer
              - Receiver
              Limit: 100
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              example:
                Receipts:
                - Identifier: <<identificador opaco>>
                  Source: automatico
                  PaymentDate: '2026-09-12'
                  Amount: 725.72
                  DueDate: '2026-09-12'
                  BankSlipNumber: <<linha digitável>>
                  CodeAuth: <<autenticação>>
                  Payer:
                    Name: EMPRESA EXEMPLO SA
                    Document: 00000000000191
                    DocType: CNPJ
                    BankCode: '001'
                  Receiver:
                    Name: FORNECEDOR EXEMPLO LTDA
                    Document: 00000000000191
                    DocType: CNPJ
                Paginator: ''
                Total: 1
        '400':
          description: Chave com caixa errada, campo desconhecido, data malformada, documento inválido, Paginator adulterado ou EncodedPdf sem
            Identifier.
        '401':
          description: Credenciais ausentes ou sem nenhum CNPJ autorizado.
        '404':
          description: 'Só com Filters.Identifier: comprovante inexistente, fora do escopo ou excluído por outro filtro.'
        '502':
          description: Falha ao obter ou gerar o PDF.
        '500':
          description: Falha interna da Qive.
