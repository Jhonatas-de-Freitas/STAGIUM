      summary: Busca de NFes — Busca XMLs de NFes pelos CNPJs da conta (por papel)
      description: 'Rota clássica (API 1.0) que devolve os XMLs (Base64) das NF-e por papel na URL: received (recebidas), emitted (emitidas),
        transporter ou authorized (citado no autXML). Pagina por cursor numérico fixo por documento e filtra por chave, CNPJ dono, data de entrada
        na Qive e property customizada. Para sincronização incremental do ERP (fila de XMLs pelo cursor ou por property ''processed''). Quando
        NÃO usar: para planilha por data de emissão ou com emitente e status já separados; aí prefira arquivei.nota_fiscal.listar.nfe (POST /v2/dfe/nfe).
        A resposta só traz chave e XML: todas as colunas saem do XML.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.arquivei.com.br/arquivei-apis-swagger/dfe-api.json
      x-data-consulta: '2026-10-14'
      x-seguro-para-executar: true
      parameters:
      - name: role
        in: path
        required: true
        schema:
          type: string
          enum:
          - received
          - emitted
          - transporter
          - authorized
          description: Papel do CNPJ da conta no documento.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 50
          description: Quantidade de documentos por resposta.
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          description: Posição a partir da qual buscar. Cada documento tem um cursor fixo; 0 reprocessa desde o início. O próximo valor vem em
            page.next.
      - name: cnpj[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Filtra pelos CNPJs/CPFs donos do documento (repetir o parâmetro para vários). Formato: 14 posições.'
        style: form
        explode: true
      - name: created_at[from]
        in: query
        required: false
        schema:
          type: string
          description: 'Início do período de ENTRADA na Qive (não é emissão). Obrigatório junto com created_at[to]. Formato: AAAA-MM-DD ou AAAA-MM-DD
            HH:MM:SS.'
      - name: created_at[to]
        in: query
        required: false
        schema:
          type: string
          description: 'Fim do período de entrada na Qive. Obrigatório junto com created_at[from]. Formato: AAAA-MM-DD ou AAAA-MM-DD HH:MM:SS.'
      - name: access_key[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Lista de chaves de acesso. Formato: 44 dígitos.'
        style: form
        explode: true
      - name: filter
        in: query
        required: false
        schema:
          type: string
          description: 'Filtro por property customizada, em notação prefixada: (= processed true), (NOT_EXISTS processed), (AND ...), (OR ...).
            Muito usado para fila de integração: marcar com PUT .../{property} o que já foi lido e buscar (NOT_EXISTS processed).'
      - name: format_type
        in: query
        required: false
        schema:
          type: string
          enum: &id002
          - xml
          - json
          description: Formato do conteúdo devolvido.
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              example:
                status:
                  code: 200
                  message: Ok
                data:
                - access_key: '35260900000000000191550010000012341000012345'
                  xml: PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4...
                page:
                  next: <<próximo cursor>>
                  previous: <<cursor anterior>>
                count: 1
                signature: <<assinatura>>
        '400':
          description: 'Parâmetro fora do formato: chave de acesso sem 44 posições, data inválida, created_at[from] sem created_at[to] (os dois
            são obrigatórios juntos).'
